<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Plugin Recommender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 40px 0; border-bottom: 1px solid #30363d; margin-bottom: 30px; }
    h1 { font-size: 2.5em; color: #58a6ff; margin-bottom: 10px; }
    .subtitle { color: #8b949e; font-size: 1.1em; }
    .stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
    .stat { text-align: center; }
    .stat-value { font-size: 2em; color: #58a6ff; font-weight: bold; }
    .stat-label { color: #8b949e; font-size: 0.9em; }
    .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 250px; padding: 12px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 1em; }
    .search-box:focus { outline: none; border-color: #58a6ff; }
    .category-filters { display: flex; flex-wrap: wrap; gap: 10px; }
    .filter-btn { padding: 8px 16px; background: #21262d; border: 1px solid #30363d; border-radius: 20px; color: #8b949e; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: white; }
    .category-section { margin-bottom: 40px; }
    .category-header { font-size: 1.5em; color: #58a6ff; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
    .category-count { background: #21262d; padding: 4px 12px; border-radius: 12px; font-size: 0.7em; color: #8b949e; }
    .plugin-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 15px; transition: transform 0.2s, border-color 0.2s; }
    .plugin-card:hover { transform: translateY(-2px); border-color: #58a6ff; }
    .plugin-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .plugin-name { font-size: 1.2em; color: #58a6ff; text-decoration: none; }
    .plugin-name:hover { text-decoration: underline; }
    .plugin-stars { background: #21262d; padding: 4px 10px; border-radius: 12px; font-size: 0.9em; color: #f0883e; }
    .plugin-desc { color: #8b949e; margin-bottom: 10px; line-height: 1.5; }
    .plugin-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
    .plugin-lang { background: #1f6feb22; color: #58a6ff; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; }
    .plugin-recommendation { background: #23863622; color: #3fb950; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; margin-top: 10px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag { background: #21262d; color: #8b949e; padding: 3px 8px; border-radius: 4px; font-size: 0.75em; }
    .loading { text-align: center; padding: 50px; color: #8b949e; }
    .error { text-align: center; padding: 50px; color: #f85149; }
    footer { text-align: center; padding: 30px 0; color: #8b949e; border-top: 1px solid #30363d; margin-top: 40px; }
    a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 DSH Plugin Recommender</h1>
      <p class="subtitle">AI-curated list of DeepSeek Harness plugins</p>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="total-plugins">-</div>
          <div class="stat-label">Plugins</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="total-categories">-</div>
          <div class="stat-label">Categories</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="last-update">-</div>
          <div class="stat-label">Last Updated</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <input type="text" class="search-box" id="search" placeholder="Search plugins...">
      <div class="category-filters" id="filters"></div>
    </div>

    <div id="content">
      <div class="loading">Loading plugins...</div>
    </div>

    <footer>
      <p>Powered by AI · Updated hourly via GitHub Actions</p>
      <p><a href="https://github.com/tanle-mtr/dsh-plogin-plugin-recommender">View on GitHub</a></p>
    </footer>
  </div>

  <script>
    let plugins = [];
    let categories = {};
    let currentFilter = 'All';

    async function loadPlugins() {
      try {
        const response = await fetch('categorized.json');
        plugins = await response.json();
        
        // Group by category
        categories = {};
        plugins.forEach(p => {
          const cat = p.category || 'Other';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(p);
        });

        updateStats();
        renderFilters();
        renderPlugins();
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="error">Failed to load plugins: ${e.message}</div>`;
      }
    }

    function updateStats() {
      document.getElementById('total-plugins').textContent = plugins.length;
      document.getElementById('total-categories').textContent = Object.keys(categories).length;
      document.getElementById('last-update').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderFilters() {
      const container = document.getElementById('filters');
      const filterData = [{ name: 'All', count: plugins.length }, ...Object.entries(categories).map(([k, v]) => ({ name: k, count: v.length }))];
      
      container.innerHTML = filterData.map(f => `
        <button class="filter-btn ${f.name === currentFilter ? 'active' : ''}" onclick="setFilter('${f.name}')">${f.name} (${f.count})</button>
      `).join('');
    }

    function setFilter(cat) {
      currentFilter = cat;
      renderFilters();
      renderPlugins();
    }

    function renderPlugins() {
      const search = document.getElementById('search').value.toLowerCase();
      const container = document.getElementById('content');
      
      let html = '';
      const catsToShow = currentFilter === 'All' ? Object.keys(categories) : [currentFilter];
      
      for (const cat of catsToShow) {
        let items = categories[cat] || [];
        
        if (search) {
          items = items.filter(p => 
            p.name.toLowerCase().includes(search) ||
            p.description.toLowerCase().includes(search) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(search)))
          );
        }
        
        if (items.length === 0) continue;
        
        html += `
          <div class="category-section">
            <div class="category-header">
              ${cat}
              <span class="category-count">${items.length}</span>
            </div>
        `;
        
        for (const p of items) {
          html += `
            <div class="plugin-card">
              <div class="plugin-header">
                <a class="plugin-name" href="${p.url}" target="_blank">${p.name}</a>
                <span class="plugin-stars">⭐ ${p.stars.toLocaleString()}</span>
              </div>
              <div class="plugin-desc">${p.description}</div>
              <div class="plugin-meta">
                <span class="plugin-lang">${p.language || 'Unknown'}</span>
              </div>
              ${p.recommendation ? `<div class="plugin-recommendation">💡 ${p.recommendation}</div>` : ''}
              ${p.tags && p.tags.length > 0 ? `<div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
            </div>
          `;
        }
        
        html += '</div>';
      }
      
      if (!html) {
        html = '<div class="loading">No plugins found matching your search.</div>';
      }
      
      container.innerHTML = html;
    }

    document.getElementById('search').addEventListener('input', renderPlugins);
    loadPlugins();
  </script>
</body>
</html>
